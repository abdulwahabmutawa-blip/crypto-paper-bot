/* EN/AR toggle — translates interface labels client-side; live data text stays as generated. */

const AR = [

 ["Currently copied trades (90-day holds)","الصفقات المنسوخة حالياً (احتفاظ 90 يوماً)"],

 ["Starting stake","رأس المال الابتدائي"],
 ["Started","تاريخ البدء"],

 ["Crypto Regime Switcher","مبدل أنظمة الكريبتو"],
 ["Leveraged Stock Trend","متداول اتجاه الأسهم بالرافعة"],
 ["Congress Copier","ناسخ صفقات الكونغرس"],

 ["Mean-Reversion Mega-Caps","الارتداد إلى المتوسط — أسهم كبرى"],
 ["All-Weather Control","المحفظة المتوازنة (مجموعة الضبط)"],
 ["The Watcher","الرقيب"],
 ["Hype Trader","متداول الضجة"],
 ["edge theory","نظرية الأفضلية"],
 ["strategy ahead by","الاستراتيجية متقدمة بمقدار "],
 ["strategy behind by","الاستراتيجية متأخرة بمقدار "],
 ["copier ahead by","الناسخ متقدم بمقدار "],
 ["copier behind by","الناسخ متأخر بمقدار "],

 ["Time (UTC)","الوقت (UTC)"],
 ["Top hype","الأكثر ضجة"],

 ["below MA","تحت المتوسط"],
 ["eligible","مؤهل"],

 ["no signal","لا إشارة"],
 ["candidate","مرشح"],
 ["euphoric","نشوة"],
 ["fearful","خوف"],
 ["mixed","متباين"],
 ["rising","صاعد"],
 ["falling","هابط"],
 ["stopped","موقوف"],
 ["HELD","محتفظ به"],
].sort((a,b)=>b[0].length-a[0].length);

let lang = localStorage.getItem("fleetLang") || "en";

function txNode(n){
  let t = n.nodeValue;
  if (!t || !t.trim()) return;
  for (const [en, ar] of AR){
    if (t.includes(en)) t = t.split(en).join(ar);
  }
  n.nodeValue = t;
}
function translate(root){
  if (lang !== "ar") return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(txNode);
}

const btn = document.createElement("button");
btn.textContent = lang === "en" ? "عربي" : "EN";
btn.title = "Switch language / تغيير اللغة";
btn.style.cssText = "position:fixed;bottom:14px;"+(lang==="ar"?"right":"left")+
  ":14px;z-index:999;padding:5px 14px;border-radius:5px;border:1px solid #777;"+
  "background:rgba(25,22,35,.85);color:#eee;cursor:pointer;font:600 13px 'Segoe UI',sans-serif";
btn.onclick = () => {
  localStorage.setItem("fleetLang", lang === "en" ? "ar" : "en");
  location.reload();
};
document.body.appendChild(btn);

if (lang === "ar"){
  document.documentElement.dir = "rtl";
  document.documentElement.lang = "ar";
  translate(document.body);
  new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType === 1) translate(n);
      else if (n.nodeType === 3) txNode(n);
    }));
  }).observe(document.body, {childList: true, subtree: true});
}
})();
</script>
