name: paper-trade-cycle

on:
  schedule:
    - cron: "*/20 * * * *"   # every ~20 min, 24/7 (GitHub may delay a few min)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run paper-trading cycle
        run: python src/crypto_tracker.py

      - name: Publish dashboard to docs/ (GitHub Pages)
        run: |
          cp reports/crypto_dashboard.html docs/index.html
          cp reports/crypto_dashboard_data.json docs/crypto_dashboard_data.json

      - name: Commit state + dashboard
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/crypto_state.json reports/ docs/
          git diff --cached --quiet || git commit -m "cycle: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
