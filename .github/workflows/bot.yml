name: paper-trade-cycle

on:
  schedule:
    - cron: "*/20 * * * *"   # every ~20 min, 24/7 (GitHub may delay a few min)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run crypto paper-trading cycle
        run: python src/crypto_tracker.py

      - name: Run stock paper-trading cycle
        run: python src/stock_tracker.py

      - name: Run congress copier cycle
        run: python src/congress_tracker.py

      - name: Run mean-reversion cycle
        run: python src/bot_meanrev.py

      - name: Run commodity trend cycle
        run: python src/bot_commodity.py

      - name: Run all-weather cycle
        run: python src/bot_allweather.py

      - name: Run Grok sentinel (self-throttled, needs XAI_API_KEY secret)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python src/grok_sentinel.py

      - name: Publish dashboards to docs/ (GitHub Pages)
        run: |
          cp reports/crypto_dashboard.html docs/index.html
          cp reports/crypto_dashboard_data.json docs/crypto_dashboard_data.json
          cp reports/stock_dashboard.html docs/stocks.html
          cp reports/stock_dashboard_data.json docs/stock_dashboard_data.json
          cp reports/congress_dashboard.html docs/congress.html
          cp reports/congress_dashboard_data.json docs/congress_dashboard_data.json
          cp reports/meanrev_dashboard.html docs/meanrev.html
          cp reports/meanrev_dashboard_data.json docs/meanrev_dashboard_data.json
          cp reports/commodity_dashboard.html docs/commodity.html
          cp reports/commodity_dashboard_data.json docs/commodity_dashboard_data.json
          cp reports/allweather_dashboard.html docs/allweather.html
          cp reports/allweather_dashboard_data.json docs/allweather_dashboard_data.json
          cp reports/sentinel_dashboard.html docs/sentinel.html || true

      - name: Commit state + dashboard
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/crypto_state.json reports/ docs/
          git diff --cached --quiet || git commit -m "cycle: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
