name: paper-trade-cycle

on:
  schedule:
    # GitHub throttles the scheduled QUEUE hard but cannot throttle a job that
    # is already RUNNING, so the work lives inside a long-running loop (see the
    # "Trade loop" step) rather than in the schedule.
    #
    # MEASURED 2026-07-26 over 8.6 days: of 72 requested starts/day GitHub
    # accepts 4.33 (6.0%). Gaps between accepted starts: median 263 min, mean
    # 324, max 675. So the loop is sized at 345 min — just under GitHub's 360
    # min per-job cap — which covers ~82% of wall-clock instead of the ~17% a
    # 55-minute loop managed. The remaining holes are the handful of gaps
    # longer than 6h, which no single job can span.
    #
    # Requesting every 20 min is deliberate even at 6% acceptance: acceptances
    # are unpredictable, so more attempts = a start lands sooner after the
    # previous loop ends. The concurrency group below makes overlap harmless.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false   # a running loop keeps the lock; new triggers queue

env:
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # loop budget is 345 min; GitHub caps jobs at 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trade loop (~5h45m, one cycle every ~13 min)
        run: |
          set +e   # never let a single failed bot or push kill the loop
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"

          run_cycle () {
            # stock_tracker retired 2026-07-31 (owner decision at v2 review);
            # its dashboard stays in docs/ as a frozen archive
            for s in crypto_tracker congress_tracker \
                     bot_meanrev bot_commodity bot_allweather bot_scholar \
                     grok_sentinel sentinel_trader hunter_tracker analyst_agent; do
              python "src/$s.py" || echo "::warning::$s.py failed this cycle"
            done

            # publish dashboards
            cp reports/crypto_dashboard.html docs/index.html
            cp reports/crypto_dashboard_data.json docs/crypto_dashboard_data.json
            cp reports/scholar_dashboard.html docs/scholar.html 2>/dev/null || true
            cp reports/scholar_dashboard_data.json docs/scholar_dashboard_data.json 2>/dev/null || true
            cp reports/congress_dashboard.html docs/congress.html
            cp reports/congress_dashboard_data.json docs/congress_dashboard_data.json
            cp reports/meanrev_dashboard.html docs/meanrev.html
            cp reports/meanrev_dashboard_data.json docs/meanrev_dashboard_data.json
            cp reports/commodity_dashboard.html docs/commodity.html
            cp reports/commodity_dashboard_data.json docs/commodity_dashboard_data.json
            cp reports/allweather_dashboard.html docs/allweather.html
            cp reports/allweather_dashboard_data.json docs/allweather_dashboard_data.json
            cp reports/sentinel_dashboard.html docs/sentinel.html 2>/dev/null || true
            cp reports/sentiment_dashboard.html docs/sentiment.html 2>/dev/null || true
            cp reports/sentiment_dashboard_data.json docs/sentiment_dashboard_data.json 2>/dev/null || true
            cp reports/hunter_dashboard.html docs/hunter.html 2>/dev/null || true
            cp reports/hunter_dashboard_data.json docs/hunter_dashboard_data.json 2>/dev/null || true
            cp reports/analyst_dashboard.html docs/analyst.html 2>/dev/null || true
            cp reports/analyst_dashboard_data.json docs/analyst_dashboard_data.json 2>/dev/null || true

            git add data/ reports/ docs/
            if ! git diff --cached --quiet; then
              git commit -m "cycle: $(date -u +'%Y-%m-%d %H:%M') UTC"
              # the supervisor also pushes to reports/; rebase before pushing so
              # our push never rejects, then retry once if the remote moved again
              for attempt in 1 2 3; do
                git pull --rebase --autostash -q && git push && break
                echo "::warning::push attempt $attempt failed, retrying"
                sleep 5
              done
            fi
          }

          END=$(( $(date +%s) + 20700 ))  # run for 345 minutes (5h45m)
          while [ "$(date +%s)" -lt "$END" ]; do
            run_cycle
            # stop early if we would overrun the budget mid-sleep
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 780                       # ~13 min between cycles
          done
          echo "loop complete"
