name: key-check

# Manual-only: validates repo API secrets without spending anything.
# The Anthropic check calls count_tokens (a free endpoint — no tokens billed).
on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Also run a full Analyst decision rehearsal (real API call, ~$0.10, records nothing)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate ANTHROPIC_API_KEY
        run: |
          python - <<'EOF'
          import os, sys
          import anthropic
          key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          if not key:
              print("::error::ANTHROPIC_API_KEY secret is not set")
              sys.exit(1)
          if key != os.environ.get("ANTHROPIC_API_KEY"):
              print("::warning::secret has leading/trailing whitespace "
                    "(handled — the bots strip it, but consider re-saving it clean)")
          try:
              r = anthropic.Anthropic(api_key=key).messages.count_tokens(
                  model="claude-opus-5",
                  messages=[{"role": "user", "content": "ping"}])
              print(f"ANTHROPIC_API_KEY OK — auth accepted "
                    f"(count_tokens returned {r.input_tokens} tokens, $0 billed)")
          except anthropic.AuthenticationError:
              print("::error::key REJECTED — check for a typo in the secret")
              sys.exit(1)
          EOF
      - name: Validate XAI_API_KEY (Watcher billing probe)
        run: |
          python - <<'EOF'
          import json, os, sys, urllib.error, urllib.request
          key = os.environ.get("XAI_API_KEY", "").strip()
          if not key:
              print("::error::XAI_API_KEY secret is not set")
              sys.exit(1)
          req = urllib.request.Request(
              "https://api.x.ai/v1/models",
              headers={"Authorization": f"Bearer {key}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  n = len(json.load(r).get("data", []))
              print(f"XAI_API_KEY OK — auth + billing accepted "
                    f"({n} models listed, $0 billed). Watcher will scan "
                    f"on its next due cycle.")
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")[:300]
              print(f"::error::xAI HTTP {e.code}: {body}")
              sys.exit(1)
          EOF
      - name: Analyst decision rehearsal (records nothing)
        if: ${{ inputs.rehearsal }}
        env:
          ANALYST_REHEARSAL: "1"
        run: python src/analyst_agent.py
